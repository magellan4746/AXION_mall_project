<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AXION은 미니멀하고 모던한 디자인을 바탕으로 일상 속 새로운 공간을 제안하는 가구 브랜드입니다. 당신의 공간을 위한 가구를 만나보세요.">
    <meta name="author" content="AXION">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.example.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AXION | 미니멀하고 모던한 가구">
    <meta property="og:description" content="미니멀하고 모던한 디자인으로 완성하는 새로운 공간. AXION과 함께 더 나은 일상을 만나보세요.">
    <meta property="og:url" content="https://www.example.com/">
    <meta property="og:image" content="https://www.example.com/slide_pc1.jpg">
    <meta property="og:site_name" content="AXION">

    <link rel="icon" type="image/png" href="./img/axion_favicon.png">
    <title>AXION 쇼핑몰 - 취업용 포트폴리오</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/header.css">

    <link rel="stylesheet" href="./css/list.css">

    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14/swiper-bundle.min.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@14/swiper-bundle.min.js"></script>
    
    <script src="./js/new-product.js"></script>
    <script src="./js/product-control-new.js" defer></script>
    
    <!-- 공통 header / footer 파일 연결 -->
    <script src="./js/include.js" defer></script>
    <script src="./js/header.js" defer></script>
</head>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들러오는영역 -->
    </div>
    <main>
        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/hero-banner-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/hero-banner-pad.jpg">
                    <img src="./img/hero-banner-pc.jpg" alt="길거리 사진">

                </picture>
            </a>
        </div>
        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>NEW ARRIVALS</h1>
                    <span></span>
                    <p>새로운 가구가 입고</p>
                </div>

                <ul class="new-product grid-list">
                    <li>
                        <a href="./product.html">
                            <figure>
                                <img src="./img/n-1.jpg" alt="NOVA Modular Sofa">
                            </figure>
                            <div class="sale-text">
                                <h4 class="title-1">NOVA Modular Sofa</h4>
                                <p class="desc-1">낮고 넓은 실루엣의 모듈형 패브릭 소파</p>
                                <div class="pay-frame">
                                    <div class="pay-original">
                                        <span>1,290,000</span>원
                                    </div>
                                    <div class="pay-discount">
                                        <div class="discount"> 15%</div>
                                        <div class="pay"><b>1,096,500</b>원</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </section>
    </main>
    <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
    </div>
</body>

</html>
